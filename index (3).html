*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#F3F5FA}
button{position:relative;overflow:hidden;font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default;opacity:.5}
button:focus-visible,.inp:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
input,select,textarea{font-family:inherit}
.app{--bg:#F3F5FA;--surface:#FFFFFF;--surface2:#F2F4F9;--surface3:#E3E8F1;--line:rgba(16,24,40,.08);--line2:rgba(16,24,40,.16);--txt:#172033;--mid:#4B5568;--dim:#646E85;--track:#E8ECF4;--glass:rgba(255,255,255,.82);--foco:rgba(79,70,229,.45);--sh1:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);--sh2:0 2px 6px rgba(16,24,40,.06),0 18px 40px rgba(16,24,40,.11);--pri:#4F46E5;--pri2:#6366F1;--onpri:#fff;--ok:#047857;--ok2:#10B981;--ongo:#fff;--meta:rgba(23,32,51,.42);
  color-scheme:light;min-height:100dvh;color:var(--txt);
  background:radial-gradient(1000px 520px at -8% -12%,rgba(99,102,241,.09),transparent 60%),radial-gradient(800px 460px at 108% -4%,rgba(16,185,129,.08),transparent 60%),var(--bg);
  font-family:Inter,"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
.app[data-tema=escuro]{--bg:#0B1020;--surface:#131B30;--surface2:#1A2340;--surface3:#26304F;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--txt:#EEF2FF;--mid:#AEB8D3;--dim:#8B96B3;--track:#212B48;--glass:rgba(11,16,32,.82);--foco:rgba(129,140,248,.6);--sh1:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);--sh2:0 2px 8px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.5);--pri:#818CF8;--pri2:#A5B4FC;--onpri:#0B1020;--ok:#34D399;--ok2:#6EE7B7;--ongo:#04261A;--meta:rgba(238,242,255,.55);
  color-scheme:dark;background:radial-gradient(1000px 520px at -8% -12%,rgba(129,140,248,.14),transparent 60%),radial-gradient(800px 460px at 108% -4%,rgba(52,211,153,.08),transparent 60%),var(--bg)}
.tela{animation:fade .28s ease}
.wrap{max-width:1240px;margin:0 auto;padding:20px 18px 84px}
.col{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.wrapc{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.g2{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:1.14rem;letter-spacing:-.035em;background:linear-gradient(120deg,var(--pri),#8B5CF6 55%,var(--ok2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.by{text-align:center;font-size:.8rem;color:var(--dim);padding:12px 0 4px;letter-spacing:.01em}
.by b{font-weight:800;color:var(--mid)}
.card,.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;color:inherit;text-align:left;font:inherit;box-shadow:var(--sh1)}
button.card,.tile{width:100%;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
@media(hover:hover){.tile:hover,button.card:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--line2)}}
button.card:active,.tile:active{transform:scale(.985)}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tiles3{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
.ico{width:56px;height:56px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.lbl{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--mid)}
.dim{color:var(--dim)}
.big{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#F3F6FA}
button{position:relative;overflow:hidden;font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default;opacity:.5}
button:focus-visible,.inp:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
input,select,textarea{font-family:inherit}
.app{--f-ui:"TF Texto","Figtree","Segoe UI",Roboto,system-ui,sans-serif;--f-disp:"TF Display","Bricolage Grotesque","Segoe UI",Roboto,system-ui,sans-serif;
  --bg:#F3F6FA;--surface:#FFFFFF;--surface2:#EDF1F7;--surface3:#E0E6F0;--line:rgba(15,28,54,.08);--line2:rgba(15,28,54,.15);--txt:#0F1C36;--mid:#46526A;--dim:#667087;--track:#E5EAF2;--glass:rgba(246,248,252,.76);--foco:rgba(43,84,230,.45);
  --sh1:0 1px 2px rgba(15,28,54,.05),0 12px 28px -16px rgba(15,28,54,.24);--sh2:0 2px 6px rgba(15,28,54,.06),0 28px 56px -24px rgba(15,28,54,.34);
  --pri:#2B54E6;--pri2:#4D72F7;--onpri:#fff;--linha:#FF5C7C;--ok:#0A8F63;--ok2:#17B583;--ongo:#fff;--meta:rgba(15,28,54,.42);
  --gr:rgba(43,84,230,.045);--gr2:rgba(43,84,230,.08);--cs:rgba(43,84,230,.20);--cs2:rgba(255,92,124,.30);--luz1:rgba(43,84,230,.13);--luz2:rgba(255,92,124,.10);--luz3:rgba(23,181,131,.09);
  color-scheme:light;position:relative;min-height:100dvh;color:var(--txt);background:var(--bg);
  font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-optical-sizing:auto}
.app[data-tema=escuro]{--bg:#0A1224;--surface:#111B32;--surface2:#16223F;--surface3:#203054;--line:rgba(226,234,255,.08);--line2:rgba(226,234,255,.16);--txt:#EAF0FF;--mid:#AAB6D3;--dim:#8792B1;--track:#1D2A49;--glass:rgba(10,18,36,.74);--foco:rgba(125,155,255,.6);
  --sh1:0 1px 2px rgba(0,0,0,.35),0 14px 30px -14px rgba(0,0,0,.6);--sh2:0 2px 8px rgba(0,0,0,.4),0 28px 56px -22px rgba(0,0,0,.7);
  --pri:#7D9BFF;--pri2:#9DB4FF;--onpri:#0A1224;--linha:#FF7D96;--ok:#3DD6A3;--ok2:#6BE5BC;--ongo:#04261A;--meta:rgba(234,240,255,.55);
  --gr:rgba(125,155,255,.05);--gr2:rgba(125,155,255,.085);--cs:rgba(125,155,255,.26);--cs2:rgba(255,125,150,.34);--luz1:rgba(77,114,247,.20);--luz2:rgba(255,92,124,.10);--luz3:rgba(23,181,131,.08);
  color-scheme:dark}
.app [style*="font-weight: 900"],.app [style*="font-weight: 800"]{font-family:var(--f-disp);letter-spacing:-.015em}
.app b,.app strong{font-weight:700}

/* fundo: papel de modelagem com costuras; nas telas de entrada as costuras andam */
.fundo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fundo .grade{position:absolute;inset:0;background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px),linear-gradient(var(--gr2) 1px,transparent 1px),linear-gradient(90deg,var(--gr2) 1px,transparent 1px);background-size:24px 24px,24px 24px,120px 120px,120px 120px;background-position:-1px -1px;-webkit-mask-image:radial-gradient(ellipse 85% 70% at 50% 28%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 85% 70% at 50% 28%,#000 25%,transparent 78%)}
.fundo .luz{position:absolute;border-radius:50%}
.fundo .l1{width:78vmax;height:78vmax;left:-30vmax;top:-42vmax;background:radial-gradient(closest-side,var(--luz1),transparent)}
.fundo .l2{width:64vmax;height:64vmax;right:-28vmax;top:-20vmax;background:radial-gradient(closest-side,var(--luz2),transparent)}
.fundo .l3{width:60vmax;height:60vmax;left:20vmax;bottom:-44vmax;background:radial-gradient(closest-side,var(--luz3),transparent)}
.fundo svg{position:absolute;inset:0;width:100%;height:100%}
.fundo .cs{fill:none;stroke:var(--cs);stroke-width:2;stroke-linecap:round;stroke-dasharray:7 9}
.fundo .cs.c2{stroke:var(--cs2)}
.fundo .cs.c3{stroke-width:1.6;opacity:.7}
.fundo .agulha{fill:var(--linha)}
.fundo .halo{fill:var(--linha);opacity:.18}
.fundo.vivo .cs{animation:pesponto 22s linear infinite}
.fundo.vivo .cs.c2{animation-duration:30s;animation-direction:reverse}
.fundo.vivo .cs.c3{animation-duration:38s}
.fundo.vivo .mk{stroke-dasharray:1;stroke-dashoffset:1;animation:costura 2.6s cubic-bezier(.45,.05,.2,1) .15s forwards}
.fundo.vivo .mk.m2{animation-delay:.45s;animation-duration:3s}
.fundo.vivo .mk.m3{animation-delay:.8s;animation-duration:3.2s}
.fundo.vivo .l1{animation:deriva1 28s ease-in-out infinite alternate}
.fundo.vivo .l2{animation:deriva2 34s ease-in-out infinite alternate}

@keyframes rip{to{transform:scale(2.4);opacity:0}}

.tema-astro{transition:transform .55s cubic-bezier(.34,1.56,.64,1)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#F3F6FA}
button{position:relative;overflow:hidden;font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default;opacity:.5}
button:focus-visible,.inp:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
input,select,textarea{font-family:inherit}
.app{--f-ui:"TF Texto","Figtree","Segoe UI",Roboto,system-ui,sans-serif;--f-disp:"TF Display","Bricolage Grotesque","Segoe UI",Roboto,system-ui,sans-serif;
  --bg:#F3F6FA;--surface:#FFFFFF;--surface2:#EDF1F7;--surface3:#E0E6F0;--line:rgba(15,28,54,.08);--line2:rgba(15,28,54,.15);--txt:#0F1C36;--mid:#46526A;--dim:#667087;--track:#E5EAF2;--glass:rgba(246,248,252,.76);--foco:rgba(43,84,230,.45);
  --sh1:0 1px 2px rgba(15,28,54,.05),0 12px 28px -16px rgba(15,28,54,.24);--sh2:0 2px 6px rgba(15,28,54,.06),0 28px 56px -24px rgba(15,28,54,.34);
  --pri:#2B54E6;--pri2:#4D72F7;--onpri:#fff;--linha:#FF5C7C;--ok:#0A8F63;--ok2:#17B583;--ongo:#fff;--meta:rgba(15,28,54,.42);
  --gr:rgba(43,84,230,.045);--gr2:rgba(43,84,230,.08);--cs:rgba(43,84,230,.20);--cs2:rgba(255,92,124,.30);--luz1:rgba(43,84,230,.13);--luz2:rgba(255,92,124,.10);--luz3:rgba(23,181,131,.09);
  color-scheme:light;position:relative;min-height:100dvh;color:var(--txt);background:var(--bg);
  font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-optical-sizing:auto}
.app[data-tema=escuro]{--bg:#0A1224;--surface:#111B32;--surface2:#16223F;--surface3:#203054;--line:rgba(226,234,255,.08);--line2:rgba(226,234,255,.16);--txt:#EAF0FF;--mid:#AAB6D3;--dim:#8792B1;--track:#1D2A49;--glass:rgba(10,18,36,.74);--foco:rgba(125,155,255,.6);
  --sh1:0 1px 2px rgba(0,0,0,.35),0 14px 30px -14px rgba(0,0,0,.6);--sh2:0 2px 8px rgba(0,0,0,.4),0 28px 56px -22px rgba(0,0,0,.7);
  --pri:#7D9BFF;--pri2:#9DB4FF;--onpri:#0A1224;--linha:#FF7D96;--ok:#3DD6A3;--ok2:#6BE5BC;--ongo:#04261A;--meta:rgba(234,240,255,.55);
  --gr:rgba(125,155,255,.05);--gr2:rgba(125,155,255,.085);--cs:rgba(125,155,255,.26);--cs2:rgba(255,125,150,.34);--luz1:rgba(77,114,247,.20);--luz2:rgba(255,92,124,.10);--luz3:rgba(23,181,131,.08);
  color-scheme:dark}
.app [style*="font-weight: 900"],.app [style*="font-weight: 800"]{font-family:var(--f-disp);letter-spacing:-.015em}
.app b,.app strong{font-weight:700}

/* fundo: papel de modelagem com costuras; nas telas de entrada as costuras andam */
.fundo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fundo .grade{position:absolute;inset:0;background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px),linear-gradient(var(--gr2) 1px,transparent 1px),linear-gradient(90deg,var(--gr2) 1px,transparent 1px);background-size:24px 24px,24px 24px,120px 120px,120px 120px;background-position:-1px -1px;-webkit-mask-image:radial-gradient(ellipse 85% 70% at 50% 28%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 85% 70% at 50% 28%,#000 25%,transparent 78%)}
.fundo .luz{position:absolute;border-radius:50%}
.fundo .l1{width:78vmax;height:78vmax;left:-30vmax;top:-42vmax;background:radial-gradient(closest-side,var(--luz1),transparent)}
.fundo .l2{width:64vmax;height:64vmax;right:-28vmax;top:-20vmax;background:radial-gradient(closest-side,var(--luz2),transparent)}
.fundo .l3{width:60vmax;height:60vmax;left:20vmax;bottom:-44vmax;background:radial-gradient(closest-side,var(--luz3),transparent)}
.fundo svg{position:absolute;inset:0;width:100%;height:100%}
.fundo .cs{fill:none;stroke:var(--cs);stroke-width:2;stroke-linecap:round;stroke-dasharray:7 9}
.fundo .cs.c2{stroke:var(--cs2)}
.fundo .cs.c3{stroke-width:1.6;opacity:.7}
.fundo .agulha{fill:var(--linha)}
.fundo .halo{fill:var(--linha);opacity:.18}
.fundo.vivo .cs{animation:pesponto 22s linear infinite}
.fundo.vivo .cs.c2{animation-duration:30s;animation-direction:reverse}
.fundo.vivo .cs.c3{animation-duration:38s}
.fundo.vivo .mk{stroke-dasharray:1;stroke-dashoffset:1;animation:costura 2.6s cubic-bezier(.45,.05,.2,1) .15s forwards}
.fundo.vivo .mk.m2{animation-delay:.45s;animation-duration:3s}
.fundo.vivo .mk.m3{animation-delay:.8s;animation-duration:3.2s}
.fundo.vivo .l1{animation:deriva1 28s ease-in-out infinite alternate}
.fundo.vivo .l2{animation:deriva2 34s ease-in-out infinite alternate}
.fundo.vivo .l3{animation:deriva1 40s ease-in-out infinite alternate-reverse}
.app>.tela{position:relative}
.fundo.sem-cs svg{display:none}
.fundo:not(.vivo) .grade{opacity:.6}

.tela{animation:fade .3s ease}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 88px}
.col{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.wrapc{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.g2{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}}

/* barra de cima */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--glass);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid var(--line)}
.top .voltar{width:44px;height:44px;min-height:44px;padding:0;font-size:1.15rem;display:inline-flex;align-items:center;justify-content:center}
.top-id{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.top-txt{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.top-txt .logo{font-size:.82rem;color:var(--dim)}
.top-tit{font-family:var(--f-disp);font-weight:700;font-size:1.12rem;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-tit .dim{font-family:var(--f-ui);font-weight:500;font-size:.9rem;letter-spacing:0}
.logo{font-family:var(--f-disp);font-weight:700;font-size:1.3rem;letter-spacing:-.035em;color:var(--txt)}
.marca{display:inline-flex;flex-shrink:0;border-radius:30%;box-shadow:0 6px 16px -6px rgba(43,84,230,.55)}
.marca svg{display:block}
.relogio{font-family:var(--f-disp);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}

/* cart\xF5es e blocos */
.card,.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;color:inherit;text-align:left;font:inherit;box-shadow:var(--sh1)}
button.card,.tile{width:100%;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
@media(hover:hover){button.card:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--line2)}}
button.card:active,.tile:active{transform:scale(.985)}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tiles3{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}

/* in\xEDcio */

.aovivo{display:inline-flex;align-items:center;gap:10px;padding:10px 16px 10px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1);font-size:.92rem;color:var(--mid);animation:fade .6s .35s backwards}

.rb i{display:block;width:100%;height:calc(var(--h) * 100%);border-radius:8px;background:linear-gradient(180deg,var(--pri2),var(--pri));transform-origin:bottom;animation:cresce .9s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(.5s + var(--i) * .06s)}
.rb.cur{outline:1.5px dashed rgba(43,84,230,.55);outline-offset:2px}

.rb.alm{flex:.4;background:transparent;border-left:1.5px dashed var(--line2);border-radius:0}

@media(max-width:760px){.pulso{flex:1 1 100%}}
.papeis{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}

.papeis .tile{--c:var(--pri);display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-height:148px;padding:18px 18px 16px;border-radius:24px;overflow:hidden;isolation:isolate;animation:sobe .6s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(.32s + var(--i,0) * .055s)}
.papeis .tile::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 14%,transparent),transparent 45%);transition:opacity .3s}

.papeis .ico{width:50px;height:50px;border-radius:15px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 20%,transparent)}

@media(max-width:760px){.papeis .tile{min-height:132px;padding:15px 14px 14px;gap:11px;border-radius:20px}.papeis .tile::after{inset:6px;border-radius:15px}.papeis .ico{width:44px;height:44px;border-radius:13px}.papeis .tt{font-size:1.02rem}.papeis .ts{font-size:.8rem}}
.continuar{border-color:rgba(23,181,131,.45)!important;background:linear-gradient(120deg,rgba(23,181,131,.10),var(--surface) 65%)!important}
.continuar::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:repeating-linear-gradient(180deg,var(--ok2) 0 6px,transparent 6px 11px)}

/* entrada (login, carregando, sem banco) */
.wrap.entrada{max-width:460px;padding-top:max(9vh,40px)}

/* bot\xF5es, chips, campos */
.btn{border:none;border-radius:14px;min-height:52px;padding:14px 20px;font-weight:700;font-size:1rem;background:var(--surface2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s}

.btn.go{width:100%;min-height:78px;font-family:var(--f-disp);font-size:1.3rem;letter-spacing:-.01em;background:linear-gradient(180deg,var(--ok2),var(--ok));color:var(--ongo);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 16px 30px -14px rgba(10,143,99,.75);margin-top:14px}

.btn.bigA.on{background:linear-gradient(180deg,var(--ok2),var(--ok));color:var(--ongo);box-shadow:0 14px 28px -12px rgba(10,143,99,.7)}
.btn.bigR.on{background:linear-gradient(180deg,#FF9A57,#E0661A);color:#fff;box-shadow:0 14px 28px -12px rgba(224,102,26,.7)}
.chip{border:1px solid var(--line);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:700;font-size:.92rem;background:var(--surface);color:var(--mid);white-space:nowrap;box-shadow:0 1px 2px rgba(15,28,54,.04);transition:background .15s,color .15s,box-shadow .2s,transform .12s,border-color .15s}

.chip:active{transform:scale(.96)}
.chip.on{background:var(--txt);border-color:transparent;color:var(--bg);box-shadow:0 8px 18px -10px rgba(15,28,54,.6)}
.app[data-tema=escuro] .chip.on{background:var(--pri);color:var(--onpri)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--mid);white-space:nowrap}
.pill.ok{background:rgba(23,181,131,.14);color:var(--ok)}
.pill.warn{background:rgba(201,130,0,.13);color:#9A6200}

.app[data-tema=escuro] .pill.warn{color:#F5B83D}.app[data-tema=escuro] .pill.gold{color:#F2C744}.app[data-tema=escuro] .pill.bad{color:#FF8A8C}
.inp{background:var(--surface);border:1.5px solid var(--line2);border-radius:14px;padding:14px 15px;color:var(--txt);font-size:1rem;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}

.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* teclado e visor */

/* barras, horas, listas */
.bar{height:10px;border-radius:10px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:10px;transition:width .9s cubic-bezier(.2,.8,.2,1)}

@media(max-width:899px){.rev{display:flex;flex-direction:column}.rev>.col{display:contents}.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}}

.sheetbg{position:fixed;inset:0;z-index:300;background:rgba(10,18,36,.36);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:660px;max-height:90dvh;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh2);animation:up .34s cubic-bezier(.2,1,.3,1)}

.cel{position:fixed;inset:0;z-index:500;overflow:hidden;background:rgba(243,246,250,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;cursor:pointer;animation:fade .2s}

.celt{font-family:var(--f-disp);font-size:clamp(2.2rem,7vw,5.2rem);font-weight:800;letter-spacing:-.045em;color:var(--txt);line-height:1.02}
.cels{font-size:clamp(1.05rem,2.4vw,1.8rem);font-weight:700;margin-top:10px;color:var(--mid)}
.andon{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ad{border-radius:22px;padding:18px 8px;text-align:center;border:1px solid}

.ad.r{background:rgba(220,59,63,.07);border-color:rgba(220,59,63,.28);color:#C42C30}

.app[data-tema=escuro] .ad.r{color:#FF8A8C}.app[data-tema=escuro] .ad.a{color:#F5B83D}.app[data-tema=escuro] .ad.g{color:#3DD6A3}

.banner{position:fixed;left:0;right:0;bottom:0;z-index:250;padding:10px 14px calc(10px + env(safe-area-inset-bottom));text-align:center;font-size:.88rem;font-weight:700;color:#fff;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

/* linha de produ\xE7\xE3o (fluxo) */

.fx{display:flex;flex-direction:column;gap:2px;min-width:0;padding:16px 18px 15px;border-radius:19px}

.fx.ok>b{color:var(--ok)}
.fx:last-child{margin-left:8px;background:var(--surface2)}
.fx.rt{background:rgba(224,102,26,.08)!important;box-shadow:inset 0 0 0 1px rgba(224,102,26,.28)}
.fx.rt>b{color:#C2531A}
.app[data-tema=escuro] .fx.rt>b{color:#FF9A57}
.seta{align-self:center;justify-self:center;width:44px;height:14px;color:var(--pri)}
.seta svg{display:block;width:100%;height:100%;overflow:visible}
.seta path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seta path:first-child{stroke-dasharray:4 5;animation:corre 1.1s linear infinite;opacity:.7}
@media(max-width:820px){.fluxo{grid-template-columns:1fr 1fr;gap:4px}.seta{display:none}.fx{padding:13px 14px 12px}.fx>b{font-size:2rem}.fx:last-child{margin-left:0}}

/* tamanhos e ficha */
.tams{display:grid;gap:8px}
.tam{min-width:0;padding:9px 4px;border-radius:15px;border:1.5px solid var(--line2);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .15s,box-shadow .15s,background .15s}
.tam b{font-size:.95rem;font-weight:700}
.tam i{font-style:normal;font-family:var(--f-disp);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--dim)}
.tam.tem i{color:var(--txt)}
.tam.on{border-color:var(--pri);background:rgba(43,84,230,.08);box-shadow:0 0 0 3px rgba(43,84,230,.16)}
.tam.on i{color:var(--pri)}
.tam.feito i{color:var(--ok)}
.tam.over{border-color:#E0661A;box-shadow:0 0 0 3px rgba(224,102,26,.16)}
.tam.over i{color:#C2531A}
.ficha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px;align-items:start}
.fcol{display:flex;flex-direction:column;gap:6px}
.fit{display:flex;align-items:stretch;gap:6px}
.fit>button{border:1px solid var(--line2);background:var(--surface);border-radius:13px;font:inherit;color:var(--txt)}
.fit-mais{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:7px 8px 7px 12px;font-size:.88rem;font-weight:600;text-align:left;line-height:1.2}
.fit-mais b{flex-shrink:0;min-width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:1rem;font-weight:700;background:var(--surface2);color:var(--dim);font-variant-numeric:tabular-nums}
.fit.tem .fit-mais{border-color:var(--pri)}
.fit.tem .fit-mais b{background:var(--pri);color:var(--onpri)}
.fit.sel .fit-mais{border-color:var(--pri);background:rgba(43,84,230,.08);box-shadow:0 0 0 3px rgba(43,84,230,.16)}
.fit-menos{width:44px;flex-shrink:0;font-size:1.3rem;font-weight:700;color:var(--mid)}
@media(max-width:560px){.ficha{grid-template-columns:minmax(0,1fr)}}
.gqs{display:grid;gap:8px;margin-top:8px}
.gq{display:flex;flex-direction:column;gap:4px}
.gq span{font-weight:700;font-size:.84rem;text-align:center;color:var(--mid)}
.gq .inp{text-align:center;padding-left:4px;padding-right:4px}

/* fechamento do turno */
.fech-aviso{border-color:rgba(201,130,0,.4)!important;background:linear-gradient(120deg,rgba(229,161,0,.10),var(--surface) 60%)!important}
.fechamento.fechado{border-color:rgba(10,148,103,.3)}
.volta-card{border-color:rgba(10,148,103,.32)!important;background:linear-gradient(120deg,rgba(23,181,131,.08),var(--surface) 60%)!important}
.volta-card:disabled{opacity:.7}
.motlista{display:flex;flex-direction:column;gap:8px}
.motl{border:1px solid var(--line2);border-radius:16px;background:var(--surface);overflow:hidden;transition:border-color .2s}
.motl.tem{border-color:rgba(10,148,103,.38)}
.motl.ab{border-color:var(--pri);box-shadow:0 0 0 3px rgba(43,84,230,.12)}
.motl-cab{border:none;background:none;width:100%;display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:14px;padding:12px 14px;text-align:left;font:inherit;color:inherit}
.motl-h{font-weight:700;font-variant-numeric:tabular-nums}
.motl-q{color:var(--mid);font-size:.9rem;white-space:nowrap}
.motl-q b{color:var(--txt);font-family:var(--f-disp);font-size:1.05rem}
.motl-m{justify-self:end;text-align:right;font-weight:700;font-size:.92rem;color:var(--pri)}
.motl-m.ok{color:var(--ok)}
.motl-m.sug{color:var(--mid);font-weight:600}
.motl-m em{display:block;font-style:normal;font-size:.74rem;color:var(--dim);font-weight:600;margin-top:2px}
.motl-op{display:flex;flex-wrap:wrap;gap:8px;padding:2px 14px 14px}
.motl-op .inp{flex-basis:100%;padding:11px 13px;font-size:.92rem}
.chip.sug{border-style:dashed;border-color:var(--pri);color:var(--pri)}
@media(max-width:560px){.motl-cab{grid-template-columns:auto 1fr;gap:4px 12px}.motl-m{grid-column:1 / -1;justify-self:start;text-align:left}}
/* cascata de perdas */
.cascata{display:flex;flex-direction:column}
.cx{display:grid;grid-template-columns:minmax(150px,1.05fr) minmax(0,2.5fr) minmax(104px,.7fr);gap:16px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cx:first-child{border-top:none}
.cx-l{min-width:0}
.cx-l b{display:block;font-weight:700;font-size:.95rem;line-height:1.2}
.cx-l span{display:block;font-size:.76rem;color:var(--dim);margin-top:2px;line-height:1.3}
.cx-trilho{position:relative;height:26px;border-radius:9px;background:var(--surface2);overflow:hidden}
.cx-trilho i{position:absolute;top:0;bottom:0;border-radius:9px;transform-origin:left center;animation:abre .9s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(.07s * var(--i))}
.cx.total i{background:linear-gradient(90deg,#22325A,#3D5288)}
.app[data-tema=escuro] .cx.total i{background:linear-gradient(90deg,#5A6E9E,#8597C4)}
.cx.perda i{background:linear-gradient(90deg,#F2B544,#D98A00)}
.cx.k-falta i{background:linear-gradient(90deg,#F27D86,#DC3B3F)}
.cx.k-qual i{background:linear-gradient(90deg,#F59A6B,#E0661A)}
.cx.k-sem i{background:repeating-linear-gradient(135deg,#9AA4B8 0 6px,#BCC4D2 6px 12px)}
.cx.ritmo i{background:repeating-linear-gradient(90deg,var(--surface3) 0 7px,transparent 7px 11px);box-shadow:inset 0 0 0 1px var(--line2)}
.cx.ganho i,.cx.final i{background:linear-gradient(90deg,var(--ok2),var(--ok))}
.cx.total .cx-l b,.cx.final .cx-l b{font-family:var(--f-disp);font-size:1.05rem}
.cx-v{text-align:right;min-width:0}
.cx-v b{display:block;font-family:var(--f-disp);font-weight:700;font-size:1.08rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.cx-v span{display:block;font-size:.76rem;color:var(--dim);white-space:nowrap}
.cx.perda .cx-v b{color:#B8501A}
.app[data-tema=escuro] .cx.perda .cx-v b{color:#FF9A57}
.cx.final .cx-v b,.cx.ganho .cx-v b{color:var(--ok)}
@media(max-width:640px){.cx{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}.cx-trilho{grid-column:1 / -1;grid-row:2;height:14px}}
.tempo-cab{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:10px}
.tempo-cab b{font-family:var(--f-disp);font-size:1.1rem;letter-spacing:-.01em}
.tempo-cab .dim{font-size:.8rem}
.tempo-bar{display:flex;gap:3px;height:36px;border-radius:12px;overflow:hidden;background:var(--surface2)}
.tempo-bar i{display:block;height:100%;transform-origin:left center;animation:abre 1s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(.15s * var(--i))}
.tb-boa{background:linear-gradient(90deg,var(--ok2),var(--ok))}
.tb-ritmo{background:repeating-linear-gradient(135deg,var(--surface3) 0 7px,var(--surface2) 7px 13px)}
.tb-perda{background:linear-gradient(90deg,#F59A6B,#E0661A)}
.tempo-leg{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:14px}
.tl{display:flex;align-items:flex-start;gap:9px}
.tl>i{width:12px;height:12px;border-radius:4px;margin-top:5px;flex-shrink:0}
.tl-boa>i{background:var(--ok)}
.tl-ritmo>i{background:repeating-linear-gradient(135deg,var(--surface3) 0 3px,var(--surface2) 3px 6px);box-shadow:inset 0 0 0 1px var(--line2)}
.tl-perda>i{background:#E0661A}
.tl b{display:block;font-size:.95rem}
.tl span{display:block;font-size:.8rem;color:var(--dim)}
.sheet .fechamento{border:none;box-shadow:none;padding:0;background:none}
@media(max-width:560px){.motl-op{display:grid;grid-template-columns:1fr 1fr}.motl-op .chip{white-space:normal;text-align:left;line-height:1.2;padding:10px 12px;border-radius:14px}.motl-op .inp{grid-column:1 / -1}}
@keyframes abre{from{transform:scaleX(0)}}
@keyframes rip{to{transform:scale(2.4);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes sobe{from{opacity:0;transform:translateY(14px)}}
@keyframes cresce{from{transform:scaleY(0)}}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes drop{from{transform:translate(-50%,-18px);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pesponto{to{stroke-dashoffset:-160}}
@keyframes costura{to{stroke-dashoffset:0}}
@keyframes corre{to{stroke-dashoffset:-9;background-position:13px 0}}
@keyframes onda{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}
@keyframes deriva1{to{transform:translate(6vmax,4vmax) scale(1.06)}}
@keyframes deriva2{to{transform:translate(-5vmax,6vmax) scale(.94)}}
